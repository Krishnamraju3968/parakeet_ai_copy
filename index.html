<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Veilpad</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --text: #f4f4f5;
        --muted: #b8b8bd;
        --accent: #c7c7cc;
        --line: rgba(255, 255, 255, 0.16);
        --surface: rgba(18, 18, 24, 0.78);
      }
      #start-listening {
        border-color: rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.07);
        color: #e2e2e5;
      }
      #start-listening:hover {
        border-color: rgba(255, 255, 255, 0.26);
        background: rgba(255, 255, 255, 0.13);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: var(--text);
      }
      .resize-handle {
        position: fixed;
        z-index: 10;
        -webkit-app-region: no-drag;
        touch-action: none;
        cursor: default !important;
      }
      .resize-handle.top,
      .resize-handle.bottom {
        right: 8px;
        left: 8px;
        height: 8px;
      }
      .resize-handle.top {
        top: 0;
      }
      .resize-handle.bottom {
        bottom: 0;
      }
      .resize-handle.left,
      .resize-handle.right {
        top: 8px;
        bottom: 8px;
        width: 8px;
      }
      .resize-handle.left {
        left: 0;
      }
      .resize-handle.right {
        right: 0;
      }
      .resize-handle.corner {
        width: 12px;
        height: 12px;
      }
      .resize-handle.top.left {
        top: 0;
        left: 0;
      }
      .resize-handle.top.right {
        top: 0;
        right: 0;
      }
      .resize-handle.bottom.left {
        bottom: 0;
        left: 0;
      }
      .resize-handle.bottom.right {
        right: 0;
        bottom: 0;
      }
      .card {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        height: 100%;
        padding: 14px 20px 13px;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        box-shadow:
          0 22px 65px rgba(0, 0, 0, 0.42),
          inset 0 1px rgba(255, 255, 255, 0.075);
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .card::before {
        content: "";
        position: absolute;
        z-index: -1;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.65),
          transparent
        );
      }
      .bar {
        -webkit-app-region: drag;
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 34px;
        user-select: none;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 10px;
        background: linear-gradient(145deg, #a5a5aa, #55555c);
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.35),
          inset 0 1px rgba(255, 255, 255, 0.24);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      .brand-name {
        font-size: 14px;
        font-weight: 680;
        letter-spacing: -0.015em;
      }

      .header-actions {
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }
      .bar button {
        -webkit-app-region: no-drag;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 10px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: #dedde8;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
        transition:
          background 150ms ease,
          border-color 150ms ease,
          color 150ms ease,
          transform 150ms ease;
      }
      .bar button:hover {
        border-color: rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .bar button:active:not(:disabled) {
        transform: translateY(1px);
      }
      .bar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .bar button:disabled:hover {
        border-color: transparent;
        background: transparent;
        color: var(--muted);
      }
      #exit {
        border-color: rgba(255, 132, 139, 0.2);
        background: linear-gradient(145deg, #d94b55, #bd3541);
        color: #fff;
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.16);
      }
      #exit:hover {
        border-color: #f17078;
        background: linear-gradient(145deg, #ee626b, #ce3e49);
        color: #fff;
      }
      #dictate-anywhere {
        color: #dedee2;
      }
      #dictate-anywhere:hover {
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      #start-listening,
      #start-computer-listening,
      #stop-listening {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #start-listening[hidden],
      #start-computer-listening[hidden] {
        display: none;
      }
      #start-listening:disabled {
        display: inline-flex;
      }
      #start-listening svg {
        color: #dedee2;
      }
      #start-computer-listening {
        border-color: rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.07);
        color: #dedee2;
      }
      #start-computer-listening:hover {
        border-color: rgba(255, 255, 255, 0.26);
        background: rgba(255, 255, 255, 0.13);
      }
      #start-computer-listening svg {
        color: #dedee2;
      }
      #dictate-anywhere svg {
        color: #dedee2;
      }
      #stop-listening {
        color: #ff9a9f;
      }
      #stop-listening:hover {
        border-color: rgba(255, 128, 128, 0.2);
        background: rgba(160, 54, 64, 0.16);
        color: #ffc0c3;
      }
      .listen-activity {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 20px;
        padding: 0 5px;
        color: #dedee2;
      }
      .listen-activity[hidden],
      #stop-listening[hidden] {
        display: none;
      }
      .listen-activity span {
        width: 2px;
        height: 5px;
        border-radius: 2px;
        background: currentColor;
        animation: listen-wave 800ms ease-in-out infinite alternate;
      }
      .listen-activity span:nth-child(2) {
        animation-delay: 120ms;
      }
      .listen-activity span:nth-child(3) {
        animation-delay: 240ms;
      }
      .listen-activity span:nth-child(4) {
        animation-delay: 360ms;
      }
      .listen-activity span:nth-child(5) {
        animation-delay: 480ms;
      }
      @keyframes listen-wave {
        from {
          height: 4px;
          opacity: 0.55;
        }
        to {
          height: 15px;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .listen-activity span {
          animation: none;
          height: 8px;
        }
      }
      .mic-meter {
        width: 42px;
        height: 4px;
        overflow: hidden;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
      }
      .mic-meter[hidden] {
        display: none;
      }
      .mic-meter-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #d4d4d8;
        transition: width 70ms linear;
      }
      .panel-section {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .search-section,
      .results-section {
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
      }
      .search-section {
        background: rgba(20, 20, 20, 0.7);
      }
      .section-title {
        margin: 0;
        color: #e5e5e8;
        font-size: 12px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .results-section {
        flex: 1;
        min-height: 0;
        background: rgba(0, 0, 0, 0.7);
        animation: results-reveal 180ms ease-out;
      }
      .results-section[hidden] {
        display: none;
      }
      @keyframes results-reveal {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .results-section {
          animation: none;
        }
      }
      #log {
        position: relative;
        flex: 1;
        min-height: 120px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 13px 8px 5px 0;
        scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
        scrollbar-width: thin;
      }
      #log:empty::before,
      #log:empty::after {
        align-self: center;
        text-align: center;
        pointer-events: none;
      }
      #log:empty::before {
        content: "A little space to think.";
        margin: auto 0 0;
        color: #e4e0fa;
        font-size: 14px;
        font-weight: 550;
        letter-spacing: 0.01em;
      }
      #log:empty::after {
        content: "Ask with Exa, or use offline voice. The speech model downloads once.";
        margin: 0 0 auto;
        color: var(--muted);
        font-size: 11px;
      }
      .msg {
        max-width: 88%;
        padding: 10px 14px;
        border: 1px solid transparent;
        border-radius: 14px;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .user {
        align-self: flex-end;
        border-color: rgba(255, 255, 255, 0.2);
        border-bottom-right-radius: 5px;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.08)
        );
        color: #f2f2f4;
      }
      .assistant {
        align-self: flex-start;
        border-color: rgba(255, 255, 255, 0.14);
        border-bottom-left-radius: 5px;
        background: rgba(255, 255, 255, 0.09);
        color: #e5e6ed;
      }
      .error {
        align-self: flex-start;
        border-color: rgba(255, 128, 128, 0.17);
        background: rgba(160, 54, 64, 0.2);
        color: #ffb9bd;
      }
      .thinking {
        color: #d0d0d5;
        font-style: italic;
      }
      .thinking::after {
        display: inline-block;
        width: 1.2em;
        content: "";
        vertical-align: bottom;
        animation: thinking-dots 1.2s steps(1, end) infinite;
      }
      @keyframes thinking-dots {
        0%,
        24% {
          content: "";
        }
        25%,
        49% {
          content: ".";
        }
        50%,
        74% {
          content: "..";
        }
        75%,
        100% {
          content: "...";
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .thinking::after {
          animation: none;
        }
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 15px;
        background: var(--surface);
        box-shadow:
          0 5px 18px rgba(0, 0, 0, 0.12),
          inset 0 1px rgba(255, 255, 255, 0.025);
        transition:
          border-color 150ms ease,
          background 150ms ease;
      }
      .row:focus-within {
        border-color: rgba(255, 255, 255, 0.42);
        background: rgba(28, 28, 30, 0.92);
        box-shadow:
          0 0 0 3px rgba(255, 255, 255, 0.07),
          0 5px 18px rgba(0, 0, 0, 0.12);
      }
      #microphone-select {
        flex: 0 1 158px;
        width: 158px;
        min-width: 112px;
        height: 38px;
        padding: 0 10px;
        border: 0;
        border-right: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px 0 0 8px;
        outline: 0;
        background: transparent;
        color: #c4c2d2;
        font: inherit;
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
        overflow: hidden;
      }
      #microphone-select option {
        background: #181923;
        color: var(--text);
      }
      textarea {
        flex: 1;
        min-width: 0;
        resize: none;
        height: 38px;
        max-height: 90px;
        overflow-y: hidden;
        padding: 10px 12px;
        border: 0;
        border-radius: 8px;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 18px;
      }
      textarea::placeholder {
        color: #b2b0c1;
      }
      .search-hint {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 1px 3px 0;
        color: #b1afc0;
        font-size: 10px;
        line-height: 14px;
      }
      .search-hint span:last-child {
        color: #c8c6d5;
      }
      .voice-status {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }
      .voice-status.error {
        color: #ffb9bd;
      }
      .voice-status[hidden] {
        display: none;
      }
      #send {
        display: grid;
        place-items: center;
        flex: 0 0 38px;
        height: 38px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(145deg, #a5a5aa, #5c5c62);
        color: #fff;
        cursor: pointer;
        box-shadow:
          0 4px 14px rgba(0, 0, 0, 0.35),
          inset 0 1px rgba(255, 255, 255, 0.22);
        transition: 150ms ease;
      }
      #send:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }
      #send:active {
        transform: translateY(0);
      }
      #send:focus-visible,
      .bar button:focus-visible,
      #microphone-select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #d5d5da;
        outline-offset: 2px;
      }
      #send:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
        transform: none;
      }
      @media (max-width: 720px) {
        .card {
          padding-right: 14px;
          padding-left: 14px;
        }
        .brand {
          gap: 7px;
        }

        .header-actions {
          gap: 3px;
        }
        .bar button {
          padding-right: 8px;
          padding-left: 8px;
        }
        #start-listening span,
        #start-computer-listening span {
          display: none;
        }
        #microphone-select {
          flex-basis: 145px;
          padding-right: 18px;
        }
        .search-hint span:last-child {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">v</span>
          <span class="brand-name">Veilpad</span>
        </div>
        <div class="header-actions">
          <div
            class="listen-activity"
            id="listening-indicator"
            role="status"
            aria-label="Listening"
            hidden
          >
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div
            class="mic-meter"
            id="mic-meter"
            role="meter"
            aria-label="Captured audio input level"
            aria-valuemin="0"
            aria-valuemax="100"
            hidden
          >
            <div class="mic-meter-fill" id="mic-meter-fill"></div>
          </div>
          <button id="start-listening" title="Listen to your microphone">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="9"
                y="3"
                width="6"
                height="12"
                rx="3"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M5.5 11a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            <span>My voice</span>
          </button>
          <button
            id="start-computer-listening"
            title="Listen to audio playing on this computer"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="4"
                width="18"
                height="13"
                rx="2"
                stroke="currentColor"
                stroke-width="1.7"
              />
              <path
                d="M8 21h8m-4-4v4m-5-9 3-3 2 2 3-4"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>Computer audio</span>
          </button>
          <button id="stop-listening" title="Stop voice input" hidden>
            Stop listening
          </button>

          <button id="clear" title="Clear conversation" disabled>
            Clear chat
          </button>
          <button id="exit" title="Exit Veilpad">Exit</button>
        </div>
      </div>
      <section
        class="panel-section search-section"
        aria-labelledby="search-heading"
      >
        <h2 class="section-title" id="search-heading">Ask Veilpad</h2>
        <div class="row">
          <select
            id="microphone-select"
            aria-label="Microphone input"
            title="Microphone input"
          >
            <option value="">Default mic</option>
          </select>
          <textarea
            id="input"
            aria-label="Message"
            placeholder="Ask a question or paste a link…"
          ></textarea>
          <button id="send" aria-label="Send message" title="Send message">
            <svg
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 12h14M13 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="search-hint" aria-hidden="true">
          <span>Enter to search · Shift+Enter for a new line</span>
          <span>Voice transcription stays on this device</span>
        </div>
        <p id="voice-status" class="voice-status" role="status" hidden></p>
      </section>
      <section
        class="panel-section results-section"
        id="results-section"
        aria-labelledby="results-heading"
        hidden
      >
        <div id="log" role="log" aria-live="polite"></div>
      </section>
    </div>
    <div id="resize-handles" aria-hidden="true">
      <div class="resize-handle top"></div>
      <div class="resize-handle right"></div>
      <div class="resize-handle bottom"></div>
      <div class="resize-handle left"></div>
      <div class="resize-handle corner top left"></div>
      <div class="resize-handle corner top right"></div>
      <div class="resize-handle corner bottom left"></div>
      <div class="resize-handle corner bottom right"></div>
    </div>

    <script>
      let activeResize;

      document.querySelectorAll(".resize-handle").forEach((handle) => {
        handle.addEventListener("pointerdown", async (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          handle.setPointerCapture(event.pointerId);
          const resize = {
            handle,
            pointerId: event.pointerId,
            direction: [...handle.classList].filter((name) =>
              ["top", "right", "bottom", "left"].includes(name),
            ),
            startX: event.screenX,
            startY: event.screenY,
          };
          activeResize = resize;
          try {
            resize.bounds = await window.overlay.getWindowBounds();
          } catch (error) {
            if (activeResize === resize) activeResize = undefined;
            console.error("Could not start resizing the window:", error);
          }
        });

        handle.addEventListener("pointermove", (event) => {
          const resize = activeResize;
          if (
            !resize ||
            resize.handle !== handle ||
            resize.pointerId !== event.pointerId ||
            !resize.bounds
          ) {
            return;
          }

          const deltaX = event.screenX - resize.startX;
          const deltaY = event.screenY - resize.startY;
          const bounds = { ...resize.bounds };
          if (resize.direction.includes("left")) {
            bounds.x += deltaX;
            bounds.width -= deltaX;
          } else if (resize.direction.includes("right")) {
            bounds.width += deltaX;
          }
          if (resize.direction.includes("top")) {
            bounds.y += deltaY;
            bounds.height -= deltaY;
          } else if (resize.direction.includes("bottom")) {
            bounds.height += deltaY;
          }

          window.overlay.setWindowBounds(bounds).catch((error) => {
            console.error("Could not resize the window:", error);
          });
        });

        const stopResizing = (event) => {
          if (activeResize?.pointerId === event.pointerId) {
            activeResize = undefined;
          }
        };
        handle.addEventListener("pointerup", stopResizing);
        handle.addEventListener("pointercancel", stopResizing);
        handle.addEventListener("lostpointercapture", stopResizing);
      });

      const log = document.getElementById("log");
      const resultsSection = document.getElementById("results-section");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const startListeningBtn = document.getElementById("start-listening");
      const startComputerListeningBtn = document.getElementById(
        "start-computer-listening",
      );
      const stopListeningBtn = document.getElementById("stop-listening");
      const dictateAnywhereBtn = document.getElementById("dictate-anywhere");
      const listeningIndicator = document.getElementById("listening-indicator");
      const microphoneSelect = document.getElementById("microphone-select");
      const microphoneMeter = document.getElementById("mic-meter");
      const microphoneMeterFill = document.getElementById("mic-meter-fill");
      const clearBtn = document.getElementById("clear");
      const voiceStatus = document.getElementById("voice-status");
      let history = [];
      let busy = false;
      let listening = false;
      let starting = false;
      let transcribing = false;
      let mediaStream;
      let audioContext;
      let audioProcessor;
      let silentGain;
      let recordedAudio = [];
      let recordingSampleCount = 0;
      let globalDictation = false;
      let listeningSource = "microphone";
      let transcriptionStatus;
      let fitWindowFrame;

      async function refreshMicrophones(
        preferredDeviceId = microphoneSelect.value,
      ) {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const microphones = devices.filter(
          (device) => device.kind === "audioinput",
        );
        const previousValue = preferredDeviceId;
        microphoneSelect.replaceChildren(new Option("Default mic", ""));
        microphones.forEach((device, index) => {
          const option = new Option(
            device.label || `Microphone ${index + 1}`,
            device.deviceId,
          );
          microphoneSelect.add(option);
        });
        if (microphones.some((device) => device.deviceId === previousValue)) {
          microphoneSelect.value = previousValue;
        }
      }

      function toWav(chunks, sourceSampleRate, sampleCount) {
        const sampleRate = 16000;
        const frameCount = Math.ceil(
          (sampleCount * sampleRate) / sourceSampleRate,
        );
        if (!frameCount) throw new Error("The microphone recording was empty.");
        const audio = new Float32Array(sampleCount);
        let chunkOffset = 0;
        for (const chunk of chunks) {
          audio.set(chunk, chunkOffset);
          chunkOffset += chunk.length;
        }
        let sumSquares = 0;
        let peak = 0;
        const wav = new ArrayBuffer(44 + frameCount * 2);
        const view = new DataView(wav);
        const write = (offset, value) => {
          for (let i = 0; i < value.length; i++)
            view.setUint8(offset + i, value.charCodeAt(i));
        };
        write(0, "RIFF");
        view.setUint32(4, wav.byteLength - 8, true);
        write(8, "WAVE");
        write(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, "data");
        view.setUint32(40, frameCount * 2, true);
        for (let i = 0; i < frameCount; i++) {
          const sourceIndex = (i * sourceSampleRate) / sampleRate;
          const lowerIndex = Math.min(
            Math.floor(sourceIndex),
            audio.length - 1,
          );
          const upperIndex = Math.min(lowerIndex + 1, audio.length - 1);
          const fraction = sourceIndex - lowerIndex;
          const sample = Math.max(
            -1,
            Math.min(
              1,
              audio[lowerIndex] * (1 - fraction) + audio[upperIndex] * fraction,
            ),
          );
          sumSquares += sample * sample;
          peak = Math.max(peak, Math.abs(sample));
          view.setInt16(
            44 + i * 2,
            sample < 0 ? sample * 0x8000 : sample * 0x7fff,
            true,
          );
        }
        return {
          data: new Uint8Array(wav),
          rms: Math.sqrt(sumSquares / frameCount),
          peak,
        };
      }

      navigator.mediaDevices?.addEventListener("devicechange", () => {
        refreshMicrophones().catch((error) =>
          console.error("Could not refresh microphone devices:", error),
        );
      });

      function updateAudioInputLevel(samples) {
        let sumSquares = 0;
        for (let i = 0; i < samples.length; i++)
          sumSquares += samples[i] * samples[i];
        const rms = Math.sqrt(sumSquares / samples.length);
        const level = Math.min(100, Math.round(rms * 500));
        microphoneMeter.setAttribute("aria-valuenow", String(level));
        microphoneMeterFill.style.width = `${level}%`;
      }

      refreshMicrophones().catch((error) =>
        console.error("Could not list microphone devices:", error),
      );

      window.overlay.onTranscriptionProgress((progress) => {
        if (!transcriptionStatus) return;
        if (progress.phase === "download") {
          const received = Math.round(progress.received / (1024 * 1024));
          const total = Math.round(progress.total / (1024 * 1024));
          transcriptionStatus.textContent = progress.total
            ? `Downloading offline speech model… ${Math.min(100, Math.round((progress.received / progress.total) * 100))}% (${received}/${total} MB)`
            : "Downloading offline speech model…";
        } else if (progress.phase === "loading") {
          transcriptionStatus.textContent = "Loading offline speech model…";
        } else if (progress.phase === "transcribing") {
          transcriptionStatus.textContent = Number.isFinite(progress.progress)
            ? `Translating… ${progress.progress}%`
            : "Translating…";
        }
      });

      function showVoiceStatus(message, isError = false) {
        voiceStatus.textContent = message;
        voiceStatus.classList.toggle("error", isError);
        voiceStatus.hidden = !message;
        scheduleWindowFit();
      }

      function clearVoiceStatus() {
        showVoiceStatus("");
      }

      function updateListeningUI(active, isTranscribing = false) {
        listening = active;
        transcribing = isTranscribing;
        startListeningBtn.hidden = active;
        startComputerListeningBtn.hidden = active;
        startListeningBtn.disabled = isTranscribing;
        startComputerListeningBtn.disabled = isTranscribing;
        stopListeningBtn.hidden = !active;
        stopListeningBtn.disabled = isTranscribing;
        stopListeningBtn.textContent = globalDictation
          ? "Stop & paste"
          : "Stop listening";
        listeningIndicator.hidden = !active;
        const sourceName =
          listeningSource === "computer" ? "computer audio" : "your microphone";
        listeningIndicator.setAttribute(
          "aria-label",
          isTranscribing ? "Transcribing audio" : `Listening to ${sourceName}`,
        );
        startListeningBtn.title = isTranscribing
          ? "Transcribing audio…"
          : "Listen to your microphone";
        startComputerListeningBtn.title = isTranscribing
          ? "Transcribing audio…"
          : "Listen to audio playing on this computer";
        microphoneMeter.hidden = !active;
        if (!active) {
          microphoneMeter.setAttribute("aria-valuenow", "0");
          microphoneMeterFill.style.width = "0";
        }
        input.readOnly = active || isTranscribing;
        updateSendButton();
      }

      function updateSendButton() {
        sendBtn.disabled =
          busy || listening || transcribing || !input.value.trim();
      }

      function updateClearButton() {
        clearBtn.disabled = busy || log.childElementCount === 0;
      }

      function resizeInput() {
        input.style.height = "38px";
        input.style.height = `${Math.min(input.scrollHeight, 90)}px`;
        input.style.overflowY = input.scrollHeight > 90 ? "auto" : "hidden";
      }

      async function startListening(
        forGlobalDictation = false,
        sourceType = "microphone",
      ) {
        if (listening || starting || transcribing) return;
        clearVoiceStatus();
        starting = true;
        globalDictation = forGlobalDictation;
        listeningSource = sourceType;
        if (
          (sourceType === "microphone" &&
            !navigator.mediaDevices?.getUserMedia) ||
          (sourceType === "computer" &&
            !navigator.mediaDevices?.getDisplayMedia) ||
          !window.AudioContext?.prototype.createScriptProcessor
        ) {
          starting = false;
          globalDictation = false;
          const message =
            sourceType === "computer"
              ? "Computer audio capture isn't supported by this version of Veilpad."
              : "Microphone recording isn't supported by this version of Veilpad.";
          if (forGlobalDictation) window.overlay.reportDictationError(message);
          else showVoiceStatus(message, true);
          return;
        }
        try {
          const selectedDeviceId = microphoneSelect.value;
          if (sourceType === "computer") {
            mediaStream = await navigator.mediaDevices.getDisplayMedia({
              audio: true,
              video: true,
            });
            mediaStream.getVideoTracks().forEach((track) => track.stop());
            const audioTrack = mediaStream.getAudioTracks()[0];
            if (!audioTrack || audioTrack.readyState !== "live") {
              throw new Error(
                "Computer audio isn't available. Allow screen and system-audio recording in your system privacy settings. When running from source, allow it for your terminal or editor too.",
              );
            }
          } else {
            mediaStream = await navigator.mediaDevices.getUserMedia({
              audio: {
                ...(selectedDeviceId
                  ? { deviceId: { exact: selectedDeviceId } }
                  : {}),
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
              },
            });
            const actualDeviceId = mediaStream
              .getAudioTracks()[0]
              ?.getSettings().deviceId;
            await refreshMicrophones(selectedDeviceId || actualDeviceId || "");
          }
          recordedAudio = [];
          recordingSampleCount = 0;
          audioContext = new AudioContext();
          await audioContext.resume();
          const source = audioContext.createMediaStreamSource(mediaStream);
          audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
          silentGain = audioContext.createGain();
          silentGain.gain.value = 0;
          audioProcessor.onaudioprocess = (event) => {
            const inputSamples = event.inputBuffer.getChannelData(0);
            const samples = new Float32Array(inputSamples);
            recordedAudio.push(samples);
            recordingSampleCount += samples.length;
            updateAudioInputLevel(samples);
          };
          source.connect(audioProcessor);
          audioProcessor.connect(silentGain);
          silentGain.connect(audioContext.destination);
          const actualDeviceId = mediaStream
            .getAudioTracks()[0]
            ?.getSettings().deviceId;
          if (
            sourceType === "microphone" &&
            selectedDeviceId &&
            selectedDeviceId !== actualDeviceId
          ) {
            throw new Error("The selected microphone could not be opened.");
          }
          updateListeningUI(true);
          microphoneSelect.disabled = sourceType !== "microphone";
          starting = false;
          if (globalDictation) window.overlay.dictationStarted();
        } catch (error) {
          starting = false;
          globalDictation = false;
          await cleanupAudioCapture();
          updateListeningUI(false);
          const message =
            sourceType === "computer"
              ? error.name === "NotAllowedError"
                ? "Computer audio access was denied. Allow screen and system-audio recording in your system privacy settings. When running from source, allow it for your terminal or editor too."
                : `Couldn't capture computer audio: ${error.message}`
              : error.name === "NotAllowedError"
                ? "Microphone access was denied. Allow Veilpad to use the microphone in System Settings."
                : error.name === "NotFoundError"
                  ? "No microphone was found. Connect a microphone and try again."
                  : `Couldn't start voice input: ${error.message}`;
          if (forGlobalDictation) window.overlay.reportDictationError(message);
          else showVoiceStatus(message, true);
        }
      }

      function stopListening() {
        if (!listening) return;
        updateListeningUI(false, true);
        microphoneSelect.disabled = false;
        transcribeRecording();
      }

      function removeTranscriptionStatus() {
        clearVoiceStatus();
        transcriptionStatus = undefined;
      }

      async function cleanupAudioCapture() {
        if (audioProcessor) {
          audioProcessor.onaudioprocess = null;
          audioProcessor.disconnect();
          audioProcessor = undefined;
        }
        silentGain?.disconnect();
        silentGain = undefined;
        mediaStream?.getTracks().forEach((track) => track.stop());
        mediaStream = undefined;
        if (audioContext && audioContext.state !== "closed") {
          await audioContext.close();
        }
        audioContext = undefined;
      }

      async function transcribeRecording() {
        const pasteIntoFocusedApp = globalDictation;
        const sourceName =
          listeningSource === "computer" ? "computer audio" : "microphone";
        transcriptionStatus = pasteIntoFocusedApp ? null : voiceStatus;
        if (transcriptionStatus) showVoiceStatus("Preparing transcription…");
        try {
          const sampleRate = audioContext?.sampleRate || 48000;
          await cleanupAudioCapture();
          const wav = toWav(recordedAudio, sampleRate, recordingSampleCount);
          if (wav.rms < 0.002 && wav.peak < 0.01) {
            throw new Error(
              sourceName === "computer"
                ? "No computer audio was captured. Play audio while listening and check your system's screen and system-audio recording permissions."
                : `No sound reached "${microphoneSelect.selectedOptions[0]?.textContent || "the selected microphone"}". Choose another microphone from the selector and check System Settings > Sound > Input.`,
            );
          }
          if (transcriptionStatus)
            showVoiceStatus("Translating…");
          const result = await window.overlay.transcribe(wav.data);
          removeTranscriptionStatus();
          if (result.error) {
            if (pasteIntoFocusedApp)
              window.overlay.reportDictationError(result.error);
            else showVoiceStatus(result.error, true);
          } else if (
            result.text &&
            !/^\[blank[_ ]audio\]$/i.test(result.text.trim())
          ) {
            if (pasteIntoFocusedApp) {
              const pasteResult = await window.overlay.pasteTranscription(
                result.text,
              );
              if (pasteResult.error)
                window.overlay.reportDictationError(pasteResult.error);
            } else {
              input.value = [input.value.trimEnd(), result.text]
                .filter(Boolean)
                .join(" ");
              resizeInput();
              updateSendButton();
            }
          } else {
            const message =
              listeningSource === "computer"
                ? "No speech was detected in computer audio. Make sure speech is playing and try again."
                : "No speech was detected. Check System Settings > Sound > Input, choose the microphone you are speaking into, and try again.";
            if (pasteIntoFocusedApp)
              window.overlay.reportDictationError(message);
            else showVoiceStatus(message, true);
          }
        } catch (error) {
          removeTranscriptionStatus();
          const message = `Couldn't transcribe audio: ${error.message}`;
          if (pasteIntoFocusedApp) window.overlay.reportDictationError(message);
          else showVoiceStatus(message, true);
        } finally {
          transcriptionStatus = undefined;
          recordedAudio = [];
          recordingSampleCount = 0;
          globalDictation = false;
          microphoneSelect.disabled = false;
          updateListeningUI(false);
          if (!pasteIntoFocusedApp) input.focus();
        }
      }

      function toggleGlobalDictation() {
        if (starting) return;
        if (globalDictation && listening) {
          stopListening();
          return;
        }
        if (listening || transcribing) {
          add(
            "error",
            "Stop the current voice recording before starting global dictation.",
          );
          return;
        }
        startListening(true);
      }

      function add(role, text, extra = "") {
        if (resultsSection.hidden) setResultsVisible(true);
        const el = document.createElement("div");
        el.className = `msg ${role} ${extra}`.trim();
        el.textContent = text; // textContent: never render model output as HTML
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        updateClearButton();
        scheduleWindowFit();
        return el;
      }

      function scheduleWindowFit() {
        if (fitWindowFrame !== undefined) return;
        fitWindowFrame = requestAnimationFrame(() => {
          fitWindowFrame = undefined;
          if (resultsSection.hidden && voiceStatus.hidden) {
            window.overlay.resetContentHeight().catch((error) => {
              console.error("Could not reset the results window:", error);
            });
            return;
          }

          const card = document.querySelector(".card");
          const previousHeight = card.style.height;
          card.style.height = "auto";
          const height =
            card.scrollHeight +
            (resultsSection.hidden ? 0 : log.scrollHeight - log.clientHeight);
          card.style.height = previousHeight;

          window.overlay.setContentHeight(Math.ceil(height)).catch((error) => {
            console.error("Could not resize the results window:", error);
          });
        });
      }

      function setResultsVisible(visible) {
        if (resultsSection.hidden === !visible) return;
        resultsSection.hidden = !visible;
        if (visible) {
          scheduleWindowFit();
        } else {
          window.overlay.resetContentHeight().catch((error) => {
            console.error("Could not reset the results window:", error);
          });
        }
      }

      const logObserver = new MutationObserver(scheduleWindowFit);
      logObserver.observe(log, {
        childList: true,
        characterData: true,
        subtree: true,
      });

      async function send() {
        const text = input.value.trim();
        if (!text || busy || listening || transcribing) return;
        busy = true;
        updateSendButton();
        input.value = "";
        resizeInput();
        history.push({ role: "user", content: text });
        add("user", text);
        const thinking = add("assistant", "Thinking", "thinking");
        let response;

        try {
          const res = await window.overlay.chat(history, (chunk) => {
            if (!response) {
              thinking.remove();
              response = add("assistant", "");
            }
            response.textContent += chunk;
            log.scrollTop = log.scrollHeight;
          });
          thinking.remove();
          if (res.error) {
            response?.remove();
            add("error", res.error);
            history.pop(); // let the user retry the same question
          } else {
            const answer = res.text || "(empty reply)";
            history.push({ role: "assistant", content: answer });
            if (response) {
              response.textContent = answer;
            } else {
              add("assistant", answer);
            }
          }
        } catch (error) {
          thinking.remove();
          response?.remove();
          add("error", `Couldn't complete the search: ${error.message}`);
          history.pop();
        } finally {
          busy = false;
          updateSendButton();
          updateClearButton();
          input.focus();
        }
      }

      sendBtn.addEventListener("click", send);
      startListeningBtn.addEventListener("click", () => startListening());
      startComputerListeningBtn.addEventListener("click", () =>
        startListening(false, "computer"),
      );
      stopListeningBtn.addEventListener("click", stopListening);
      dictateAnywhereBtn?.addEventListener("click", () =>
        window.overlay.toggleGlobalDictation(),
      );
      input.addEventListener("input", () => {
        resizeInput();
        updateSendButton();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      document.getElementById("clear").addEventListener("click", () => {
        if (busy) return;
        history = [];
        log.innerHTML = "";
        updateClearButton();
        setResultsVisible(false);
      });
      document.getElementById("exit").addEventListener("click", () => {
        window.overlay.quitApp();
      });

      updateSendButton();
      window.overlay.onClickThrough((on) => {
        const mode = document.getElementById("mode");
        mode.textContent = on ? "click-through" : "interactive";
        mode.classList.toggle("click-through", on);
      });
      window.overlay.onFocusInput(() => input.focus());
      window.overlay.onGlobalDictationToggle(toggleGlobalDictation);
      window.overlay.onDictationError((message) => add("error", message));
    </script>
  </body>
</html>
